[mysqld]
# --- MEMORY ALLOCATION ---
# Set to ~75% of physical memory (48GB out of 64GB)
innodb_buffer_pool_size = 48G
# Use 16 instances to reduce mutex contention on a high-core CPU
innodb_buffer_pool_instances = 16

# --- WAL TRANSACTIONS & BUFFERING ---
# Large 64MB memory buffer for uncommitted transaction logs
innodb_log_buffer_size = 64M
# Allocates 8GB of disk space for the WAL loop, avoiding write stalls
innodb_redo_log_capacity = 8G

# --- THE HIGH-THROUGHPUT TUNING ---
# CRITICAL: Bypasses immediate disk flush on every commit. Writes to OS cache 
# instantly, flushes to physical disk 1x per second. Yields ~10x write performance.
innodb_flush_log_at_trx_commit = 2

# Bypasses the OS page cache for data files to prevent double-buffering
innodb_flush_method = O_DIRECT

# --- OPTIONAL HARDWARE OPTIMIZATION ---
# Set to 0 IF AND ONLY IF you run on NVMe storage with Power Loss Protection (PLP)
# or AWS RDS Optimized Writes. This turns off the secondary Doublewrite Buffer.
# innodb_doublewrite = 0
  
