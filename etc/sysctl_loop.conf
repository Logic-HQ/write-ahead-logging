# --- Disable Reverse Path Filtering (Crucial for ILB) ---
# Prevents the Linux kernel from dropping packets sent via the Load Balancer VIP
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.eth0.rp_filter = 0

# --- Maximize Local Loop & VPC Ingestion Queues ---
# Maximize the network device input queue for high-core count instances
net.core.netdev_max_backlog = 250000

# Drastically raise maximum concurrent connections handled by the listening socket
net.core.somaxconn = 65535

# --- Aggressive TCP Buffer Recycling for Internal VPC ---
# Since latency is <1ms within the VPC, minimize memory overhead for idle connections
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Enable TCP window scaling to fully exploit the 50Gbps+ Tier 1 GCP network pipelines
net.ipv4.tcp_window_scaling = 1
