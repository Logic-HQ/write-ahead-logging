# --- GCP Firewall 10-Minute Timeout Mitigation ---
# Start sending keepalive probes after 1 minute of absolute idleness
net.ipv4.tcp_keepalive_time = 60
# Send 5 probes before deciding the connection is dead
net.ipv4.tcp_keepalive_probes = 5
# Wait 10 seconds between individual probes
net.ipv4.tcp_keepalive_intvl = 10

# --- Advanced TCP Buffer & BBR Congestion Control ---
# Switch to BBR Congestion Control (developed by Google, ideal for GCP infrastructure)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Turn off slow start after an idle period (keeps the window open)
net.ipv4.tcp_slow_start_after_idle = 0
