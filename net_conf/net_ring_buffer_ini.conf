# --- Socket Receive Memory Allocation ---
# Increase the maximum memory allocated for network packet receive buffers (approx 64MB)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864

# Set default and maximum buffer sizes for individual TCP streams (min, default, max in bytes)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# --- Connection Backlog Buffers ---
# Increase the maximum number of packets allowed to queue if the CPU can't keep up
net.core.netdev_max_backlog = 100000

# Increase the maximum TCP connection backlog queue (prevents connection drops during spikes)
net.core.somaxconn = 65535

# --- TCP Ring Buffer & Queue Reuse ---
# Enable fast recycling of TIME_WAIT sockets for high-frequency incoming connections
net.ipv4.tcp_tw_reuse = 1
